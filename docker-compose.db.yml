# Banco de dados do kimium Hub
#
# Mesmo sendo desenvolvimento, este banco guarda uma cópia da produção — é onde
# migration é ensaiada antes de subir. Sem volume nomeado, o dado vivia na
# camada gravável do contêiner: sobrevivia a `restart`, mas sumia num
# `docker compose down` ou num reset do Docker Desktop.

# ⚠ Este arquivo PRECISA do `--env-file` na linha de comando:
#
#     docker compose --env-file /root/api/.env.db -f docker-compose.db.yml up -d
#
# Sao dois mecanismos diferentes, e confundi-los custa uma subida: `env_file:`
# entrega variaveis DENTRO do container, em tempo de execucao; a interpolacao
# `${...}` deste arquivo acontece ANTES, no CLI, e so enxerga o shell ou o
# `--env-file`. Sem ele, `${DB_USER}` vira string vazia e o Postgres sobe com o
# usuario errado, sem reclamar. Confira antes de subir:
#
#     docker compose --env-file /root/api/.env.db -f docker-compose.db.yml config | grep POSTGRES
#
# O `.env.db` tem tres linhas, e so elas: DB_USER, DB_PASSWORD e DB_NAME.
# As senhas do kimium_app e do kimium_dev nao entram em arquivo nenhum aqui --
# sao digitadas no SQL que cria os usuarios, e depois so aparecem no `.env` da
# API, em DATABASE_USERNAME e DATABASE_PASSWORD.

services:

  kimium-database:
    container_name: kimium_db
    image: postgres:18-alpine
    restart: always

    # **Sem `env_file:` de proposito.**
    #
    # O `.env` da API tem JWT, MASTER_KEY, chaves VAPID, senha de SMTP e as
    # credenciais do Sankhya -- e o Postgres nao usa nada disso. Com o
    # `env_file:` apontando para la, o container do banco recebia todos esses
    # segredos, e um `docker inspect kimium_db` imprime todos eles.
    #
    # A imagem le exatamente tres variaveis, e elas vem do bloco abaixo, que o
    # CLI interpola a partir do `--env-file /root/api/.env.db`.
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Sao_Paulo
    shm_size: 256mb

    # **`127.0.0.1:` na frente, e isso nao e detalhe.**
    #
    # Sem o endereco, o Docker publica em 0.0.0.0 — na VPS, e Postgres aberto
    # para a internet. IP de VPS com 5432 exposto e varrido e atacado por forca
    # bruta em horas, e este banco vai guardar holerite, CPF e curriculo.
    #
    # A API fala pela rede do Docker e nao precisa da porta publicada. Para
    # acessar do seu micro, tunel SSH:
    #     ssh -L 5432:127.0.0.1:5432 root@vps
    ports:
      - "127.0.0.1:5432:5432"
    # `/var/lib/postgresql`, e NÃO `/var/lib/postgresql/data`.
    #
    # O PostgreSQL 18 mudou o layout: o PGDATA virou
    # `/var/lib/postgresql/18/docker`, e é o diretório pai que a imagem declara
    # como volume. Montar no caminho antigo falha em silêncio — o contêiner
    # sobe, o volume nomeado existe, e o dado continua indo para um volume
    # anônimo que a recriação abandona.
    volumes:
      - kimium-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kimium-network

