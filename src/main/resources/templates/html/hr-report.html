<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(area='Recursos Humanos', preheader='Comprovante de reembolsos ' + ${escopo} + ', ' + ${periodo} + '. PDF anexado.', conteudo=~{::conteudo})}">
<!--
  O corpo só diz o que é e de quem veio. Nome e valor de cada pessoa ficam no
  PDF anexado: caixa de entrada é encaminhada, e o corpo aparece em pré-visualização.
-->
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{html/pecas :: titulo('Comprovante de reembolsos', 'Recursos Humanos')}"></th:block>
    <p th:replace="~{html/pecas :: texto('Segue em anexo o comprovante de solicitações de reembolso ' + ${escopo} + ', período de ' + ${periodo} + '.')}"></p>
    <table th:replace="~{html/pecas :: quadro(${ { {'Status incluídos', status}, {'Emitido por', emitidoPor}, {'Emitido em', emitidoEm} } })}"></table>
    <table th:replace="~{html/pecas :: anexo(${arquivo}, 'PDF anexado a este e-mail')}"></table>
    <p th:replace="~{html/pecas :: pequeno('Enviado pelo KimiumHub a pedido de quem emitiu. Os mesmos dados podem ser gerados de novo em Recursos Humanos › Reembolsos.')}"></p>
</th:block>
</body>
</html>
