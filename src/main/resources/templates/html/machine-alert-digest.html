<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(area='Programação', preheader=${resumo}, conteudo=~{::conteudo})}">
<!--
  Um e-mail por dia com tudo: as atrasadas primeiro (a mais atrasada no topo) e
  depois as saídas próximas (a mais perto no topo). Antes era um e-mail por
  máquina — com dez atrasadas, dez e-mails por pessoa, todo dia.
-->
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{html/pecas :: titulo('Resumo da programação', null)}"></th:block>
    <p th:replace="~{html/pecas :: texto(${resumo})}"></p>

    <th:block th:if="${totalAtrasadas > 0}">
        <p th:replace="~{html/pecas :: lista-titulo('Atrasadas (' + ${totalAtrasadas} + ')', true)}"></p>
        <th:block th:replace="~{html/pecas :: lista(~{::atrasadas}, true)}"></th:block>
    </th:block>

    <th:block th:if="${totalProximas > 0}">
        <p th:replace="~{html/pecas :: lista-titulo('Saídas próximas (' + ${totalProximas} + ')', false)}"></p>
        <th:block th:replace="~{html/pecas :: lista(~{::proximas}, false)}"></th:block>
    </th:block>

    <table th:replace="~{html/pecas :: botao('Abrir a programação', ${link})}"></table>
</th:block>

<!-- As linhas de cada lista: fora do conteúdo, para a peça da lista pôr dentro da moldura. -->
<th:block th:fragment="atrasadas">
    <th:block th:each="item, st : ${atrasadas}"><tr th:replace="~{html/pecas :: linha(${item.maquina}, ${item.cliente} + (${item.regiao} != null ? ' · ' + ${item.regiao} : ''), 'previsão ' + ${item.previsao} + (${item.pessoas} != null and ${item.pessoas} != '' ? ' · ' + ${item.pessoas} : ''), ${item.chamada}, ${st.first}, true)}"></tr></th:block>
</th:block>
<th:block th:fragment="proximas">
    <th:block th:each="item, st : ${proximas}"><tr th:replace="~{html/pecas :: linha(${item.maquina}, ${item.cliente} + (${item.regiao} != null ? ' · ' + ${item.regiao} : ''), ${item.pessoas} != null and ${item.pessoas} != '' ? ${item.pessoas} : null, ${item.chamada} + ' · ' + ${item.previsao}, ${st.first}, false)}"></tr></th:block>
</th:block>
</body>
</html>
