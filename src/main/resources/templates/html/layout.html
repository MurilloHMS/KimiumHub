<!DOCTYPE html>
<!--
  O casco de TODOS os e-mails do ERP (padrão aprovado em 2026-10-07). As peças
  (título, texto, código, botão, quadro, lista, alerta, anexo) estão em pecas.html.

  Cada e-mail é um arquivo com só o miolo e se encaixa aqui:

    <html th:replace="~{html/layout :: email(area='Documentos', preheader=${chamada}, conteudo=~{::conteudo})}">
      <body><th:block th:fragment="conteudo"> … as peças … </th:block></body>
    </html>

  Regras de e-mail, que não são as da web:
  - tabelas e estilo inline: o Outlook do Windows ignora <style>, flexbox e grid;
  - Arial: fonte da web não carrega na maioria dos programas;
  - 600 px de largura, que encolhe no celular (width 100% + max-width);
  - o vermelho só na peça de alerta: o cabeçalho é sempre o azul da marca.

  Mudar cor, logo ou rodapé aqui muda todos os e-mails de uma vez.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="email(area, preheader, conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title th:text="${area}">Proauto Kimium</title>
</head>
<body style="margin:0; padding:0; background:#f4f6fa;">
<!-- O pré-cabeçalho: a linha cinza que a caixa de entrada mostra antes de abrir. -->
<div th:if="${preheader}" th:text="${preheader}"
     style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#f4f6fa;">Resumo</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6fa;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%; max-width:600px; background:#ffffff; border:1px solid #e6e9f0; border-radius:12px; overflow:hidden;">
                <tr>
                    <td style="background:#232e61; padding:18px 28px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="font-family:Arial,Helvetica,sans-serif; font-size:18px; font-weight:bold; color:#ffffff; letter-spacing:0.3px;">
                                    Proauto <span style="color:#57c1ab;">Kimium</span>
                                </td>
                                <td align="right" th:text="${area}"
                                    style="font-family:Arial,Helvetica,sans-serif; font-size:12px; color:#c9d0ea;">Área</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="height:4px; line-height:4px; font-size:0; background:#57c1ab;">&nbsp;</td>
                </tr>
                <tr>
                    <td style="padding:28px 28px 12px;">
                        <th:block th:replace="${conteudo}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td style="padding:18px 28px 24px; border-top:1px solid #e6e9f0;">
                        <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#5d6579;">
                            Este é um e-mail automático do Portal Proauto Kimium. Não é preciso responder.<br>
                            Proauto Kimium · <a href="https://www.proautokimium.com.br" style="color:#232e61;">proautokimium.com.br</a>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
