<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(area='Newsletter · ' + ${mes}, preheader=${nomeDoCliente} + ': o resumo de ' + ${mes} + ' com a Proauto Kimium.', conteudo=~{::conteudo})}">
<!--
  A newsletter mensal do cliente, no casco comum (2026-10-07).

  Dinheiro sempre no formato do Brasil: formatDecimal(valor, 1, 'POINT', 2, 'COMMA')
  dá "1.234,56". A versão anterior usava 'COMMA'/'POINT' (o formato americano,
  "1,234.56") e imprimia três valores sem formatar nenhum.

  O logo agora é o do casco (texto). O NewsletterService ainda anexa a imagem
  por CID (addInline "proautoLogo"); sem referência no HTML, alguns programas
  mostram essa imagem como anexo — tirar o addInline no Java.
-->
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{html/pecas :: titulo('Seu resumo de ' + ${mes}, ${nomeDoCliente})}"></th:block>
    <p th:replace="~{html/pecas :: texto('Um resumo do que fizemos juntos no mês. Obrigado pela confiança na nossa parceria!')}"></p>

    <th:block th:if="${produtoEmDestaque != null and produtoEmDestaque != ''}">
        <p th:replace="~{html/pecas :: lista-titulo('Produto mais comprado', false)}"></p>
        <p th:replace="~{html/pecas :: texto(${produtoEmDestaque})}"></p>
    </th:block>

    <p th:replace="~{html/pecas :: lista-titulo('Suas compras', false)}"></p>
    <table th:replace="~{html/pecas :: quadro(${ {
            {'Produtos comprados', #numbers.formatInteger(quantidadeDeProdutos, 1, 'POINT')},
            {'Litros / kg', #numbers.formatInteger(quantidadeDeLitros, 1, 'POINT')},
            {'Faturamento do mês', 'R$ ' + #numbers.formatDecimal(faturamentoTotal, 1, 'POINT', 2, 'COMMA')}
        } })}"></table>

    <th:block th:if="${quantidadeDeVisitas > 0}">
        <p th:replace="~{html/pecas :: lista-titulo('Manutenções', false)}"></p>
        <table th:replace="~{html/pecas :: quadro(${ {
                {'Visitas de manutenção', #numbers.formatInteger(quantidadeDeVisitas, 1, 'POINT')},
                {'Peças trocadas', 'R$ ' + #numbers.formatDecimal(valorDePecasTrocadas, 1, 'POINT', 2, 'COMMA')},
                {'Média de dias por atendimento', #numbers.formatInteger(mediaDiasAtendimento, 1, 'POINT')}
            } })}"></table>
    </th:block>

    <th:block th:if="${valorTotalDeHoras > 0}">
        <p th:replace="~{html/pecas :: lista-titulo('Horas de manutenção', false)}"></p>
        <table th:replace="~{html/pecas :: quadro(${ {
                {'Total de horas', #numbers.formatDecimal(valorTotalDeHoras, 1, 'POINT', 2, 'COMMA') + ' h'},
                {'Valor total', 'R$ ' + #numbers.formatDecimal(valorTotalCobradoHoras, 1, 'POINT', 2, 'COMMA')},
                {'Horas normais', #numbers.formatDecimal(horasNormais, 1, 'POINT', 2, 'COMMA') + ' h · R$ ' + #numbers.formatDecimal(valorHorasNormais, 1, 'POINT', 2, 'COMMA')},
                {'Horas de mau uso', #numbers.formatDecimal(horasMauUso, 1, 'POINT', 2, 'COMMA') + ' h · R$ ' + #numbers.formatDecimal(valorHorasMauUso, 1, 'POINT', 2, 'COMMA')}
            } })}"></table>
        <p th:replace="~{html/pecas :: pequeno('Horas de mau uso são serviços fora do escopo da garantia ou da manutenção preventiva.')}"></p>
    </th:block>

    <p th:replace="~{html/pecas :: pequeno('Fale com a gente: (11) 9 5778-2766 (WhatsApp) · sac@proautokimium.com.br · Av. João do Prado, 300, Santo André, SP.')}"></p>
</th:block>
</body>
</html>
