<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(area='Banco de Talentos', preheader='Seus dados ficam guardados até ' + ${dataDeExpiracao} + '. Quer continuar?', conteudo=~{::conteudo})}">
<!--
  Mesma regra do e-mail de acesso: nada de dado pessoal aqui dentro. A data de
  vencimento é a única informação do cadastro, e ela não identifica ninguém.
-->
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{html/pecas :: titulo('Seus dados no Banco de Talentos vencem em breve', ${primeiroNome} != null ? 'Olá, ' + ${primeiroNome} : 'Olá')}"></th:block>
    <p th:replace="~{html/pecas :: texto('Seus dados ficam guardados no nosso banco de talentos até ' + ${dataDeExpiracao} + '. Depois dessa data, apagamos seu nome, seus contatos e seu currículo.')}"></p>
    <p th:replace="~{html/pecas :: texto('Quer continuar sendo lembrado para vagas futuras? Abra seus dados, marque a autorização de novo e salve. O prazo volta a contar 24 meses a partir desse dia. Se não quiser continuar, não precisa fazer nada.')}"></p>
    <table th:replace="~{html/pecas :: botao('Continuar no banco de talentos', ${actionUrl})}"></table>
    <th:block th:if="${comToken}"><p th:replace="~{html/pecas :: pequeno('O link expira em ' + ${ttlHoras} + ' horas. Depois disso, peça outro no site.')}"></p></th:block>
    <th:block th:unless="${comToken}"><p th:replace="~{html/pecas :: pequeno('No site, informe seu e-mail para receber o link de acesso.')}"></p></th:block>
    <p th:replace="~{html/pecas :: pequeno('Você recebe esta mensagem porque autorizou a Proauto Kimium a guardar seus dados para vagas futuras.')}"></p>
</th:block>
</body>
</html>
