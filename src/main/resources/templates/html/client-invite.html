<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(area='Área do Cliente', preheader=${customerName} + ' já pode acompanhar a operação pelo portal.', conteudo=~{::conteudo})}">
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{html/pecas :: titulo('Sua empresa agora acompanha tudo pelo portal', ${customerName})}"></th:block>
    <p th:replace="~{html/pecas :: texto('Faturamento, produtos, horas técnicas e manutenções, mês a mês, em um só lugar. Para começar, defina a sua senha no botão abaixo.')}"></p>
    <table th:replace="~{html/pecas :: botao('Definir minha senha', ${actionUrl})}"></table>
    <p th:replace="~{html/pecas :: link-reserva(${actionUrl})}"></p>
    <p th:replace="~{html/pecas :: pequeno('O convite expira em ' + ${ttlHours} + ' horas. Se você não esperava este convite, ignore este e-mail: sem a senha definida, o acesso não existe.')}"></p>
</th:block>
</body>
</html>
