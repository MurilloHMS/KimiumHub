<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/layout :: email(area='Banco de Talentos', preheader='Veja, corrija ou apague seus dados. O link vale por ' + ${ttlHoras} + ' horas.', conteudo=~{::conteudo})}">
<!--
  Nada de dado pessoal dentro deste e-mail: nem telefone, nem nome de arquivo,
  nem área de interesse. Caixa de entrada é encaminhada e compartilhada; o link
  é a chave, e os dados ficam atrás dele.
-->
<body>
<th:block th:fragment="conteudo">
    <th:block th:replace="~{html/pecas :: titulo('Seus dados no Banco de Talentos', ${primeiroNome} != null ? 'Olá, ' + ${primeiroNome} : 'Olá')}"></th:block>
    <p th:replace="~{html/pecas :: texto('Alguém pediu um link para ver e atualizar os dados enviados ao nosso banco de talentos. Se foi você, é só clicar no botão abaixo.')}"></p>
    <p th:replace="~{html/pecas :: texto('Lá você confere o que enviou, corrige seus dados, troca o currículo ou apaga tudo.')}"></p>
    <table th:replace="~{html/pecas :: botao('Ver e atualizar meus dados', ${actionUrl})}"></table>
    <p th:replace="~{html/pecas :: pequeno('O link expira em ' + ${ttlHoras} + ' horas. Se não foi você que pediu, pode ignorar: o link expira sozinho e nada muda no seu cadastro.')}"></p>
</th:block>
</body>
</html>
