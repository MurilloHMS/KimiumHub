spring.application.name=api
spring.profiles.active=dev
# Compressão gzip das respostas JSON (2026-09-30). O catálogo do checklist,
# que o celular do vendedor baixa, tem 3,3 MB de JSON e cai para ~650 KB — na
# rua, no 4G, é a diferença. Só recebe gzip quem manda Accept-Encoding: gzip.
# O mínimo de 64 KB vale só para resposta de tamanho conhecido: o JSON do
# Spring sai em fluxo, sem Content-Length, e aí o Tomcat comprime qualquer
# tamanho (medido). E resposta com ETag FORTE nunca é comprimida — o catálogo
# usa ETag fraco (W/"...") por isso.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=64KB
# Relatório do SMTP Locaweb, para saber se o e-mail chegou ao destinatário
# (rastreio de entrega, V122). Sem o token o rastreio fica desligado em
# silêncio: é o caso dos testes e de quem roda a API em casa sem ele.
smtp.report.api-url=https://api.smtplw.com.br
smtp.report.token=${SMTP_API_TOKEN:}
