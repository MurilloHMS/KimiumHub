services:
  api:
    build: .
    image: kimium-api:local
    container_name: kimium-api
    ports:
      - "5007:5007"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=America/Sao_Paulo
    volumes:
      - /var/proauto/curriculos:/app/curriculos
      - /var/proauto/upload/images:/app/upload/images
      - /var/proauto/upload/equipment:/app/upload/equipment
      - /var/proauto/upload/profile:/app/upload/profile
      - /var/proauto/upload/signature:/app/upload/signature
      - /var/proauto/upload/events:/app/upload/events
      - /var/proauto/funcionario/holerite:/app/funcionario/holerite
      - /var/proauto/funcionario/documentos:/app/funcionario/documentos
      - /var/proauto/funcionario/reembolsos:/app/funcionario/reembolsos
      - /var/proauto/funcionario/atestados:/app/funcionario/atestados
      - /var/proauto/recibos-locacao:/app/recibos-locacao
      - /var/proauto/upload/gallery:/app/galeria
    restart: always

    # No Windows e no macOS o Docker Desktop resolve este nome sozinho. Num
    # host Linux ele nao existe, e precisaria de:
    #     extra_hosts:
    #       - "host.docker.internal:host-gateway"
    #
    # O DATABASE_URL vai no `.env` (que o git ignora) e aponta para
    # host.docker.internal:5433 -- a ponta de ca do tunel SSH.

# **Sem rede declarada, de proposito.**
#
# Enquanto o banco era um container ao lado, os dois precisavam da mesma rede
# para se enxergar por nome. Agora o banco esta na VPS e o caminho e o tunel
# SSH, que termina no HOST: a rede padrao do Docker ja alcanca o host por
# `host.docker.internal`, e uma rede externa aqui so criaria um
# `docker network create` a mais para lembrar em cada maquina.