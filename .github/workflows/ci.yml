name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: mvn install:install-file -Dfile="libs/montserrat-font.jar" -DgroupId="custom.fonts" -DartifactId=montserrat -Dversion="1.0" -Dpackaging=jar

      - run: ./mvnw verify

  # ═══════════════════════════════════════════════════════════════════════════
  # O deploy.
  #
  # **O `needs: test` é o ponto deste job.** Até 2026-09-03 o build da imagem
  # vivia num workflow separado, também disparado por push de tag — os dois
  # corriam lado a lado, sem nada ligando um ao outro. Uma tag num commit com
  # teste quebrado publicava a imagem quebrada, e ninguém via.
  #
  # Agora não há como: sem o `test` verde, este job nem existe.
  #
  # Quem constrói e sobe é o Jenkins, na própria VPS. O GitHub só avisa que a
  # tag passou nos testes — a imagem nunca sai da máquina, então não há Docker
  # Hub no caminho.
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Avisar o Jenkins que a tag esta liberada
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          # Secret que nao existe chega aqui como string vazia, e o Jenkins
          # responde 403 — um erro que fala de permissao quando o problema e
          # configuracao, mandando quem le procurar no lugar errado.
          for nome in JENKINS_URL JENKINS_JOB JENKINS_USER JENKINS_TOKEN; do
            if [ -z "${!nome}" ]; then
              echo "::error::O secret $nome nao esta definido no repositorio."
              echo "Settings > Secrets and variables > Actions > New repository secret"
              exit 1
            fi
          done

          # **Autentica como usuario, com token de API.**
          #
          # A primeira versao usava o "token de build" do job, que dispara sem
          # login. So que o Jenkins continua perguntando se o ANONIMO pode
          # construir aquele job — e na configuracao padrao ele nao pode. O
          # resultado era 403 mesmo com o token certo.
          #
          # Token de API resolve os dois lados: identifica o usuario, que tem
          # permissao, e dispensa o crumb de CSRF que o POST exigiria.
          #
          # `-f` faz o passo falhar em 4xx/5xx. Sem ele o curl sai com sucesso
          # mesmo quando o Jenkins recusa, e o workflow ficaria verde
          # anunciando um deploy que nunca comecou.
          curl -fsS -X POST \
            --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            --data-urlencode "TAG=${GITHUB_REF_NAME}" \
            "${JENKINS_URL}/job/${JENKINS_JOB}/buildWithParameters"

          echo "Deploy da ${GITHUB_REF_NAME} pedido ao Jenkins."
